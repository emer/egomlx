name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'

    - name: Set up Core
      uses: cogentcore/core/.github/actions/setup-core@main

    - name: Build
      run: go build -v ./...

    # The tests use the pure-Go gomlx backend: the default XLA backend
    # downloads its CPU plugin from GitHub on first use, which can be
    # rate limited on CI runners.
    - name: Test
      env:
        GOMLX_BACKEND: go
      run: go test -v ./... -coverprofile cover.out

    # Publishing the coverage report to the wiki does not fail the build.
    - name: Update coverage report
      uses: cogentcore/goal-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
      continue-on-error: true
