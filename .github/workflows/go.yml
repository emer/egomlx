name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'

    # The Linux packages that Cogent Core needs to build the GUI (as
    # installed by `core setup`), cached across runs: installing them
    # from the apt mirrors can take many minutes.
    - name: Install GUI dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: gcc libgl1-mesa-dev libegl1-mesa-dev mesa-vulkan-drivers xorg-dev libwayland-dev libxkbcommon-dev
        version: 1.0

    - name: Build
      run: go build -v ./...

    # The tests use the pure-Go gomlx backend: the default XLA backend
    # downloads its CPU plugin from GitHub on first use, which can be
    # rate limited on CI runners.
    - name: Test
      env:
        GOMLX_BACKEND: go
      run: go test -v ./... -coverprofile cover.out

    # Publishing the coverage report to the wiki does not fail the build.
    - name: Update coverage report
      uses: cogentcore/goal-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
      continue-on-error: true
